[package]
name = "ntsentry"
version = "0.1.0"
edition = "2024"
description = "NtSentry AIO Process Viewer: Windows tamper detection, system inventory and confirmed process actions"
license = "MIT"

# A standalone package, not a member of any enclosing workspace.
[workspace]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence"] }
egui_extras = "0.37"
serde = { version = "1", features = ["derive"] }
tray-icon = "0.26"
serde_json = "1"
sha2 = "0.10"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Catalog",
  "Win32_Security_Cryptography_Sip",
  "Win32_Security_WinTrust",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_EventLog",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_Services",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Wdk_System_SystemInformation",
  "Wdk_System_Threading",
] }

[profile.release]
lto = "thin"
codegen-units = 1
